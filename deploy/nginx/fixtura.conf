# nginx — Fixtura (reverse proxy → app Adonis/PM2 sur 127.0.0.1:3333)
#
# À copier en /etc/nginx/sites-available/fixtura.conf puis l'activer via un lien
# symbolique dans sites-enabled/. Le TLS est ajouté automatiquement par certbot :
#   sudo certbot --nginx -d fixtura.fr -d www.fixtura.fr
# (certbot injecte le bloc 443 + la redirection 80 → 443 en conservant ce contenu.)

server {
    listen 80;
    listen [::]:80;
    server_name fixtura.fr www.fixtura.fr;

    client_max_body_size 5m;

    # Compression des réponses texte (cf. audit perf #3). text/html est compressé
    # d'office par nginx ; on ajoute JS/CSS/JSON/SVG. Les woff2 sont déjà compressés
    # (exclus). Le flux SSE (text/event-stream) n'est volontairement PAS dans la liste
    # et reste non compressé (cf. « gzip off » dans /__transmit ci-dessous).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Temps réel (SSE via @adonisjs/transmit) : PAS de buffering, connexions
    # longues — sinon le classement/scores live ne se diffusent jamais.
    location /__transmit {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        # Jamais compresser le flux SSE (bufferiserait / casserait le live).
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
