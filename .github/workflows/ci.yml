name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck & tests unitaires
    runs-on: ubuntu-latest
    env:
      TZ: UTC
      HOST: localhost
      PORT: '3333'
      LOG_LEVEL: info
      APP_KEY: 0123456789abcdef0123456789abcdef
      NODE_ENV: test
      SESSION_DRIVER: cookie
      # Valeurs factices : les tests unitaires ne se connectent pas à la base
      # (cf. tests/bootstrap.ts — le serveur HTTP/DB n'est démarré que pour les
      # suites functional/browser).
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_USER: fixtura
      DB_PASSWORD: fixtura
      DB_DATABASE: fixtura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node ace test unit
