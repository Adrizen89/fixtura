name: Déploiement

on:
  push:
    branches: [main]
  pull_request:

# Env commun aux jobs qui démarrent l'app (tests, build). Les DB_* pointent vers
# le service PostgreSQL du job « quality » (tests fonctionnels) ; en prod, le
# déploiement lit le vrai .env du VPS.
env:
  TZ: UTC
  HOST: localhost
  PORT: '3333'
  LOG_LEVEL: info
  APP_KEY: 0123456789abcdef0123456789abcdef
  SESSION_DRIVER: cookie
  DB_HOST: 127.0.0.1
  DB_PORT: '5432'
  DB_USER: fixtura
  DB_PASSWORD: fixtura
  DB_DATABASE: fixtura

jobs:
  quality:
    name: Types et lint
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    # Les tests fonctionnels (tests/functional) démarrent l'app et frappent la
    # base : on fournit un PostgreSQL éphémère et on migre avant de lancer la suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixtura
          POSTGRES_PASSWORD: fixtura
          POSTGRES_DB: fixtura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixtura"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node ace migration:run --force
      - run: node ace test

  build:
    name: Construire l'app
    needs: quality
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --include=dev : node ace build a besoin des devDeps (ts-node, vite, tsc)
      # même si NODE_ENV=production.
      - run: npm ci --include=dev
      - run: node ace build

  deploy:
    name: Migrer et déployer
    needs: build
    runs-on: ubuntu-latest
    # Uniquement sur un push vers main — jamais sur les pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Déployer via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/fixtura
            git pull --ff-only
            npm ci
            node ace build
            cp .env build/.env

            # Sauvegarde de la base AVANT la migration (rollback possible).
            # Prérequis VPS : pg_dump (paquet postgresql-client). Le .env de prod
            # doit rester « source-able » (lignes KEY=value standard).
            set -a; . ./.env; set +a
            BACKUP_DIR="${FIXTURA_BACKUP_DIR:-$HOME/fixtura-backups}"
            mkdir -p "$BACKUP_DIR"
            PGPASSWORD="$DB_PASSWORD" pg_dump \
              -h "${DB_HOST:-127.0.0.1}" -p "${DB_PORT:-5432}" \
              -U "$DB_USER" "$DB_DATABASE" \
              > "$BACKUP_DIR/fixtura-$(date -u +%Y%m%d-%H%M%S).sql"
            # Rotation : ne conserver que les 10 dumps les plus récents.
            ls -1t "$BACKUP_DIR"/fixtura-*.sql | tail -n +11 | xargs -r rm --

            cd build && npm ci --omit=dev
            node ace migration:run --force
            cd ..
            pm2 reload ecosystem.config.cjs
            pm2 save

            # Health check : l'app doit répondre après le reload, sinon on échoue
            # le déploiement (plutôt que de le découvrir via les utilisateurs).
            # Sonde /up (liveness, 200 sans DB ni auth — issue #118).
            for i in $(seq 1 10); do
              if curl -fsS "http://127.0.0.1:${PORT:-3333}/up" -o /dev/null; then
                echo "Health check OK (tentative $i)"
                exit 0
              fi
              echo "En attente de l'app… ($i/10)"
              sleep 2
            done
            echo "Health check échoué : l'app ne répond pas après le reload" >&2
            exit 1
