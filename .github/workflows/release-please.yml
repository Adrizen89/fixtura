name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Ouvre/maj une PR de release à partir des Conventional Commits, puis
      # (une fois la PR mergée) crée le tag, la GitHub Release et le CHANGELOG.
      # La config est lue depuis release-please-config.json + le manifest.
      - uses: googleapis/release-please-action@v4
        with:
          # Un PAT / token de GitHub App (secret RELEASE_PLEASE_TOKEN) permet aux
          # autres workflows (CI de deploy.yml) de s'exécuter sur la PR de release :
          # le GITHUB_TOKEN par défaut ne déclenche jamais d'autre workflow
          # (anti-récursion), d'où le statut « action_required » observé sinon.
          # Repli sur GITHUB_TOKEN tant que le secret n'est pas configuré.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
