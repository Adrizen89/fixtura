version: 2
updates:
  # Dépendances npm de l'application.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Regroupe les mises à jour mineures/patch en une seule PR pour limiter le bruit.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # Préfixes Conventional Commits → titres de PR conformes (release-please + lint).
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  # Actions GitHub utilisées dans les workflows (prépare/entretient le pin par SHA).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
